<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pseudo-assembly/pasm.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pseudo assembly</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" crossorigin src="/pseudo-assembly/assets/main-yXyGVvbG.js"></script>
    <link rel="modulepreload" crossorigin href="/pseudo-assembly/assets/index-C8xyt24a.js">
    <link rel="stylesheet" crossorigin href="/pseudo-assembly/assets/style-45ePYWjs.css">
  </head>
  <body class="font-mono">
    <nav
      class="absolute top-0 right-0 left-0 z-100 px-12 py-6 flex flex-row justify-between items-center"
    >
      <a href="/pseudo-assembly/">
        <h1 class="text-xl">pseudo assembly</h1>
      </a>
      <div class="flex items-center gap-4 text-xl">
        <a href="/pseudo-assembly/">playground</a>
        <a href="/pseudo-assembly/tutorial">tutorial</a>
        <a href="/pseudo-assembly/docs">docs</a>
        <a href="https://github.com/j-krolak/pseudo-assembly">
          <img
            src="/pseudo-assembly/github-mark-white.svg"
            alt="GitHub"
            width="20"
            height="20"
          />
        </a>
      </div>
    </nav>
    <div
      class="relative min-h-screen w-full bg-black flex justify-center flex-col px-12 py-24"
    >
      <div
        class="z-0 absolute inset-0 [background-size:40px_40px] [background-image:linear-gradient(to_right,#262626_1px,transparent_1px),linear-gradient(to_bottom,#262626_1px,transparent_1px)]"
      ></div>
      <div
        class="z-0 pointer-events-none absolute inset-0 flex items-center justify-center bg-white [mask-image:radial-gradient(ellipse_at_center,transparent_20%,black)] dark:bg-black"
      ></div>

      <div id="app" class="relative z-10 flex xl:flex-row flex-col gap-4">
        <div class="panel flex-1 px-4 pb-4 flex flex-col">
          <div
            class="flex justify-between items-center mb-2 sticky top-0 bg-black z-10 pb-2 pt-4"
          >
            <label>registers</label>
            <div id="registers-format" class="dropdown"></div>
          </div>
          <div class="flex-1 flex justify-center items-center">
            <div id="registers"></div>
          </div>
        </div>
        <div id="code-editor" class="panel flex-1 px-4">
          <div>
            <div
              id="editor-toolbar"
              class="flex items-center justify-between gap-2 mb-1 sticky top-0 bg-black z-10 pt-4 pb-1"
            >
              <div class="flex items-center gap-4">
                <label class="flex items-center gap-2">
                  <input
                    type="checkbox"
                    id="vim-mode-toggle"
                    class="toggle-checkbox"
                  />
                  vim
                </label>
                <label class="flex items-center gap-2">
                  <input
                    type="checkbox"
                    id="syntax-highlight-toggle"
                    class="toggle-checkbox"
                  />
                  syntax
                </label>
                <label class="flex items-center gap-2">
                  <input
                    type="checkbox"
                    id="label-align-toggle"
                    class="toggle-checkbox"
                  />
                  align
                </label>
              </div>
              <div class="flex items-center gap-2">
                <label> files</label>
                <div id="examples-select" class="dropdown"></div>
              </div>
            </div>
            <div id="code"></div>
          </div>
          <div
            id="editor-bottom-bar"
            class="flex gap-4 flex-col sticky bottom-0 bg-black pt-2 pb-4"
          >
            <div id="errors" class="text-red-500"></div>
            <div class="flex justify-end gap-2">
              <button
                id="stop-btn"
                title="stop (shift+F5)"
                class="hidden group px-2 py-1 border bg-black hover:bg-white hover:text-black"
              >
                stop
                <span class="text-gray-500 group-hover:text-black"
                  >shift+f5</span
                >
              </button>
              <button
                id="next-btn"
                title="run line by line (F10)"
                class="group px-2 py-1 border bg-black hover:bg-white hover:text-black active:bg-white active:bg-"
              >
                run line by line
                <span class="text-gray-500 group-hover:text-black">f10</span>
              </button>
              <button
                id="run-btn"
                title="run (F5)"
                class="group px-2 py-1 border bg-black hover:bg-white hover:text-black"
              >
                run <span class="text-gray-500 group-hover:text-black">f5</span>
              </button>
              <button
                id="play-btn"
                title="auto-step through the program"
                class="hidden group px-2 py-1 border bg-black hover:bg-white hover:text-black"
              >
                play
              </button>
            </div>
          </div>
        </div>
        <div class="panel flex-1 pb-4 px-4 flex flex-col">
          <div
            class="flex justify-between items-center mb-2 sticky top-0 bg-black z-10 pb-2 pt-4"
          >
            <label>memory</label>
            <div id="memory-format" class="dropdown"></div>
          </div>
          <div class="flex-1 flex justify-center items-center">
            <div id="memory"></div>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
